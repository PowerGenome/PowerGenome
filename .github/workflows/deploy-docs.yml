name: Deploy Documentation

on:
  push:
    branches:
      - master
      - v0.8.0-beta
      - gs/docs-0.8
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for mike versioning

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mike

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Deploy latest (from master)
        if: github.ref == 'refs/heads/master'
        run: |
          mike deploy --push --update-aliases latest

      - name: Deploy version (from tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mike deploy --push --update-aliases $VERSION

      - name: Deploy beta (from beta branch)
        if: github.ref == 'refs/heads/v0.8.0-beta'
        run: |
          mike deploy --push v0.8-beta beta

      - name: Set default version
        if: github.ref == 'refs/heads/master'
        run: |
          mike set-default --push latest
