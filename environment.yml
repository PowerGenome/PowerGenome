name: powergenome
channels:
  - conda-forge
  # - defaults
dependencies:
  - python=3.12 # Default development version; the package supports >=3.11
  - pip
  - black
  - pytest
  - pytest-cov
  - pyyaml
  - isort
  - pre-commit
  - statsmodels>=0.12.2
  - conda-forge::python-dotenv
  - conda-forge::flatten-dict
  - conda-forge::ruamel.yaml
  - conda-forge::frozendict
  - numpy
  - openpyxl>=3.0
  - pandas>=2.2.0,<4
  - duckdb>=1.3.0
  - pyarrow
  - scikit-learn
  - requests
  - xlrd

  # GIS dependencies from conda-forge
  - conda-forge::fiona
  - conda-forge::geopandas>=0.12
  - conda-forge::pyogrio
  - conda-forge::shapely
