[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PowerGenome"
dynamic = ["version"]
authors = [{ name = "Greg Schivley", email = "greg.schivley@princeton.edu" }]
maintainers = [
    { name = "Greg Schivley", email = "greg.schivley@princeton.edu" },
]
description = "Create power system inputs for capacity expansion models"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["power system data", "capacity expansion", "two"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.2,<3",
    "duckdb >= 1.3.0",
    "pyarrow",
    "beautifulsoup4 >= 4.8.13",
    "statsmodels>=0.12.2",
    "python-dotenv",
    "flatten-dict",
    "ruamel.yaml",
    "pyyaml",
    "frozendict",
    "openpyxl>=3.0",
    "geopandas>=0.12",
    "pyogrio",
    "xlrd",
    "scikit-learn",
    "requests",
    "networkx",
]

[tool.hatch.version]
path = "powergenome/version.py"

[tool.hatch.build.targets.sdist]
only-include = ["powergenome", "data"]
exclude = ["/data/eia*"]


[tool.hatch.build.targets.wheel]
only-include = ["powergenome", "data"]
exclude = ["/data/eia*"]


[project.optional-dependencies]
dev = [
    "black[jupyter] == 24.3.0",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "isort",
    "build",
    "twine",
    "hypothesis",
]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.4.0", "mike>=2.0.0"]

[project.scripts]
run_powergenome = "powergenome.run_powergenome:main"

[project.urls]
"Source" = "https://github.com/PowerGenome/PowerGenome"

[tool.isort]
profile = "black"
