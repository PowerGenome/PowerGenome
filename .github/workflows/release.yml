name: Publish Python Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/pytest.yml'
      - '.github/scripts/**'
      - 'tests/release_workflow_test.py'
  workflow_dispatch:
    inputs:
      event:
        description: Destination
        type: choice
        options:
          - Publish
          - Publish to TestPyPI
        default: Publish
      ref:
        description: Existing version tag to publish (for example, v0.11.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.event || 'Publish' }}-${{ github.event_name == 'pull_request' && github.ref || (inputs.ref || github.ref_name) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name != 'pull_request' && (inputs.ref || github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: tooling
          persist-credentials: false
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', inputs.ref || github.ref_name) }}
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: uv build source --out-dir dist
      - name: Validate distributions and release version
        id: metadata
        run: |
          uv run --no-project --with packaging python tooling/.github/scripts/check_release.py dist
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  unit-tests:
    needs: build
    uses: ./.github/workflows/pytest.yml
    with:
      ref: ${{ needs.build.outputs.sha }}

  genx-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GENX_PRECOMPILE: 'false'
      JULIA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: tooling
          persist-credentials: false
      - name: Check out pinned example system
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: PowerGenome/PowerGenome-examples
          ref: f831e48320e9171beb01b7edca7841a0906a68da
          path: examples
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - name: Install the candidate wheel
        run: |
          uv venv --python 3.12
          uv pip install dist/*.whl
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate TX-3-zone inputs
        working-directory: examples
        run: |
          mkdir -p release-smoke
          run_powergenome -sf example_systems/TX-3-zone/settings -rf release-smoke -c base \
            2>&1 | tee release-smoke/powergenome.log
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3
        with:
          delete-old-caches: 'false'
      - name: Install pinned GenX
        run: |
          julia --project=genx-env -e 'using Pkg; Pkg.add([
            PackageSpec(name="GenX", version="0.4.5"),
            PackageSpec(name="JuMP"),
          ])'
      - name: Solve the first planning period
        run: |
          case_dir="$GITHUB_WORKSPACE/examples/release-smoke/base/Inputs/Inputs_p1"
          mkdir -p "$case_dir/settings"
          cp examples/example_systems/genx_settings/*.yml "$case_dir/settings/"
          julia --project=genx-env tooling/.github/scripts/solve_release_case.jl "$case_dir" \
            2>&1 | tee examples/release-smoke/genx.log
      - name: Save inputs, solver logs, and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-genx-smoke
          path: |
            examples/release-smoke/
            genx-env/Project.toml
            genx-env/Manifest.toml
          if-no-files-found: warn

  publish:
    if: github.event_name != 'pull_request'
    needs: [build, unit-tests, genx-smoke]
    runs-on: ubuntu-latest
    environment: ${{ inputs.event == 'Publish to TestPyPI' && 'test-pypi' || 'release' }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Attest tested distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Publish to TestPyPI
        if: inputs.event == 'Publish to TestPyPI'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.event != 'Publish to TestPyPI'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    if: github.event_name != 'pull_request' && inputs.event != 'Publish to TestPyPI'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Create release or attach distributions
        run: |
          tags="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<< "$tags"; then
            gh release upload "$RELEASE_TAG" dist/*
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
          fi
